# CallPilot Configuration
# ──────────────────────────────────────────────────────────────
# First time? Run `/callpilot init` instead — it writes this
# file for you interactively in about 2 minutes.
# ──────────────────────────────────────────────────────────────

# ── Transcript Source ─────────────────────────────────────────
# Which meeting tool you use.
# Options: fireflies | otter | zoom | manual
#
# "manual" = drop callpilot_transcript.txt in your project root.
# Also works for: Slack threads, email chains, support tickets.

transcript_source:
  type: fireflies
  api_key: ${FIREFLIES_API_KEY}

  # Otter:
  # type: otter
  # client_id: ${OTTER_CLIENT_ID}
  # client_secret: ${OTTER_CLIENT_SECRET}

  # Zoom:
  # type: zoom
  # account_id: ${ZOOM_ACCOUNT_ID}
  # client_id: ${ZOOM_CLIENT_ID}
  # client_secret: ${ZOOM_CLIENT_SECRET}

# ── Operating Mode ────────────────────────────────────────────
# confirm: show preview + wait for approval before acting
# auto:    execute immediately
#
# Omit this field to let CallPilot auto-promote from confirm → auto
# after 5 successful confirmed runs. That's the recommended default.
#
# mode: confirm   # uncomment to always review
# mode: auto      # uncomment to skip confirmation permanently

# ── Teams ─────────────────────────────────────────────────────
# Each team needs at minimum: name, description, repos.
# slack_channel and oncall are optional — if omitted, CallPilot
# routes complex items to GitHub Issues instead of Slack.
#
# IMPORTANT: Write rich descriptions. This is what CallPilot uses
# to route issues. The more specific, the better the routing.

teams:
  - name: auth
    description: >
      Authentication, login, logout, sessions, OAuth, passwords, tokens,
      user accounts, permissions, access control, signup, 2FA, SSO,
      session expiry, cookie management, security, unauthorized errors,
      JWT, refresh tokens, password reset, email verification
    repos:
      - your-org/auth-service
      - your-org/user-service
    slack_channel: "#team-auth"   # optional — remove if you don't use Slack
    oncall: "@your-auth-lead"     # optional — used in Slack pings

  - name: data
    description: >
      Data pipelines, analytics, dashboards, charts, graphs, exports,
      CSV, PDF, Excel, reporting, data warehouse, ETL, metrics,
      aggregations, slow queries, data accuracy, missing data,
      wrong numbers, stale data, caching, database performance
    repos:
      - your-org/data-pipeline
      - your-org/analytics-service
    slack_channel: "#team-data"
    oncall: "@your-data-lead"

  - name: frontend
    description: >
      UI, web app, design, forms, pages, navigation, layout, CSS,
      components, buttons, modals, mobile responsiveness, browser bugs,
      Safari, Chrome, Firefox, loading states, visual glitches,
      responsive design, accessibility, UX, user interface
    repos:
      - your-org/web-app
    slack_channel: "#team-frontend"
    oncall: "@your-frontend-lead"

  - name: platform
    description: >
      APIs, backend services, infrastructure, deployments, performance,
      latency, downtime, errors, 500s, integrations, webhooks,
      third-party services, rate limiting, timeouts, reliability,
      uptime, CI/CD, DevOps, cloud infrastructure, Kubernetes, Docker
    repos:
      - your-org/api-service
      - your-org/platform-infra
    slack_channel: "#team-platform"
    oncall: "@your-platform-lead"

# ── Backlog ───────────────────────────────────────────────────
# Where new feature requests go.
# Options:
#   type: github_issues — creates Issues in a GitHub repo (default)
#   type: linear        — creates Issues in Linear (requires Linear MCP)

backlog:
  type: github_issues
  repo: your-org/product-roadmap

  # For Linear:
  # type: linear
  # linear_team_id: TEAM_ID   # find in Linear: Settings → Teams

# ── Fallback ──────────────────────────────────────────────────
# What happens when CallPilot can't confidently route an item.
# Options: slack_channel | github_issue | ping_both

fallback:
  strategy: slack_channel
  slack_channel: "#engineering"   # optional if Slack not connected
  mention: "@oncall-lead"

# ── Routing ───────────────────────────────────────────────────

routing:
  # Confidence threshold (0.0–1.0).
  # Below this → fallback. Start at 0.75. Lower if too many items
  # hit fallback; raise if items are being misrouted.
  confidence_threshold: 0.75

# ── Summary Channel ───────────────────────────────────────────
# Optional: after every run, post a summary to this Slack channel.
# Great for giving PMs and founders visibility without opening a terminal.
# Remove this section if you don't want the summary post.

summary:
  slack_channel: "#callpilot"     # will be created if it doesn't exist

# ── Pull Request Settings ─────────────────────────────────────

pr:
  draft: true           # always open as draft — human reviews AI code
  label: "callpilot"    # create this first: gh label create callpilot --color 0075ca
